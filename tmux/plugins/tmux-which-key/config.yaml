# yaml-language-server: $schema=config.schema.yaml
command_alias_start_index: 200
keybindings:
  # root_table: C-Space
  prefix_table: Space
title:
  style: align=centre,bold
  prefix: tmux
  prefix_style: fg=green,align=centre,bold
position:
  x: R
  y: P
custom_variables:
  - name: log_info
    value: "#[fg=green,italics] [info]#[default]#[italics]"
macros:
  - name: reload-config
    commands:
      - display "#{log_info} Loading config... "
      - source-file $HOME/.tmux.conf
      - display -p "\n\n... Press ENTER to continue"
  - name: restart-pane
    commands:
      - display "#{log_info} Restarting pane"
      - "respawnp -k -c #{pane_current_path}"
items:
  - name: Run
    key: space
    command: command-prompt
  - name: Last window
    key: tab
    command: last-window
  - name: Last pane
    key: "`"
    command: last-pane
  - name: Copy
    key: c
    menu:
      - name: Copy
        key: c
        command: copy-mode
      - name: List buffers
        key: "#"
        command: list-buffers
  - separator: true
  - name: +Windows
    key: w
    menu:
      - name: Last
        key: tab
        command: last-window
      - name: Choose
        key: w
        command: choose-tree -Zw
      - name: Previous
        key: p
        command: previous-window
      - name: Next
        key: n
        command: next-window
      - name: New
        key: c
        command: "neww -c #{pane_current_path}"
      - separator: true
      - name: +Layout
        key: l
        menu:
          - name: Next
            key: l
            command: nextl
            transient: true
          - name: Tiled
            key: t
            command: selectnl tiled
          - name: Horizontal
            key: h
            command: selectl even-horizontal
          - name: Vertical
            key: v
            command: selectl even-vertical
          - name: Horizontal main
            key: H
            command: selectl main-horizontal
          - name: Vertical main
            key: V
            command: selectl main-vertical
      - name: Split horizontal
        key: /
        command: "splitw -h -c #{pane_current_path}"
      - name: Split vertical
        key: "-"
        command: "splitw -v -c #{pane_current_path}"
      - name: Rotate
        key: o
        command: rotatew
        transient: true
      - name: Rotate reverse
        key: O
        command: rotatew -D
        transient: true
      - separator: true
      - name: Rename
        key: R
        command: command-prompt -I "#W" "renamew -- \"%%\""
      - name: Kill
        key: X
        command: 'confirm -p "Kill window #W? (y/n)" killw'
  - name: +Panes
    key: p
    menu:
      - name: Last
        key: tab
        command: lastp
      - name: Choose
        key: p
        command: displayp -d 0
      - separator: true
      - name: Left
        key: h
        command: selectp -L
      - name: Down
        key: j
        command: selectp -D
      - name: Up
        key: k
        command: selectp -U
      - name: Right
        key: l
        command: selectp -R
      - separator: true
      - name: Zoom
        key: z
        command: resizep -Z
      - name: +Resize
        key: r
        menu:
          - name: Left
            key: h
            command: resizep -L
            transient: true
          - name: Down
            key: j
            command: resizep -D
            transient: true
          - name: Up
            key: k
            command: resizep -U
            transient: true
          - name: Right
            key: l
            command: resizep -R
            transient: true
          - name: Left more
            key: H
            command: resizep -L 10
            transient: true
          - name: Down more
            key: J
            command: resizep -D 10
            transient: true
          - name: Up more
            key: K
            command: resizep -U 10
            transient: true
          - name: Right more
            key: L
            command: resizep -R 10
            transient: true
      - name: Swap left
        key: H
        command: swapp -t "{left-of}"
      - name: Swap down
        key: J
        command: swapp -t "{down-of}"
      - name: Swap up
        key: K
        command: swapp -t "{up-of}"
      - name: Swap right
        key: L
        command: swapp -t "{right-of}"
      - name: Break
        key: "!"
        command: break-pane
      - separator: true
      - name: Mark
        key: m
        command: selectp -m
      - name: Unmark
        key: M
        command: selectp -M
      - name: Capture
        key: C
        command: capture-pane
      - name: Respawn pane
        key: R
        macro: restart-pane
      - name: Kill
        key: X
        command: 'confirm -p "Kill pane #P? (y/n)" killp'
  - name: +Buffers
    key: b
    menu:
      - name: Choose
        key: b
        command: choose-buffer -Z
      - name: List
        key: l
        command: lsb
      - name: Paste
        key: p
        command: pasteb
  - name: +Sessions
    key: s
    menu:
      - name: Choose
        key: s
        command: choose-tree -Zs
      - name: New
        key: N
        command: new
      - name: Rename
        key: r
        command: rename
  - name: +Client
    key: C
    menu:
      - name: Choose
        key: c
        command: choose-client -Z
      - name: Last
        key: l
        command: switchc -l
      - name: Previous
        key: p
        command: switchc -p
      - name: Next
        key: n
        command: switchc -n
      - separator: true
      - name: Refresh
        key: R
        command: refresh
      - name: +Plugins
        key: P
        menu:
          - name: Install
            key: i
            command:
              run-shell $TMUX_PLUGIN_MANAGER_PATH/tpm/bindings/install_plugins
          - name: Update
            key: u
            command:
              run-shell $TMUX_PLUGIN_MANAGER_PATH/tpm/bindings/update_plugins
          - name: Clean
            key: c
            command:
              run-shell $TMUX_PLUGIN_MANAGER_PATH/tpm/bindings/clean_plugins
      - name: Detach
        key: D
        command: detach
      - name: Suspend
        key: Z
        command: suspendc
      - separator: true
      - name: Reload config
        key: r
        macro: reload-config
      - name: Customize
        key: ","
        command: customize-mode -Z
  - separator: true
  - name: Time
    key: T
    command: clock-mode
  - name: Show messages
    key: "~"
    command: show-messages
  - separator: true
  - name: +Custom
    key: x
    menu:
      - name: Lazygit popup
        key: g
        command: 'display-popup -d "#{pane_current_path}" -E "lazygit"'
      - name: New session
        key: S
        command: command-prompt -p "New Session:" "new-session -A -s '%%'"
      - name: Move window left
        key: H
        command: swap-window -t -1
        transient: true
      - name: Move window right
        key: L
        command: swap-window -t +1
        transient: true
      - separator: true
      - name: +Go to window
        key: G
        menu:
          - { name: "Window 0", key: "0", command: "select-window -t 0" }
          - { name: "Window 1", key: "1", command: "select-window -t 1" }
          - { name: "Window 2", key: "2", command: "select-window -t 2" }
          - { name: "Window 3", key: "3", command: "select-window -t 3" }
          - { name: "Window 4", key: "4", command: "select-window -t 4" }
          - { name: "Window 5", key: "5", command: "select-window -t 5" }
          - { name: "Window 6", key: "6", command: "select-window -t 6" }
          - { name: "Window 7", key: "7", command: "select-window -t 7" }
          - { name: "Window 8", key: "8", command: "select-window -t 8" }
          - { name: "Window 9", key: "9", command: "select-window -t 9" }
      - name: +Pane navigation
        key: e
        menu:
          - { name: "Left",      key: h, command: "select-pane -L" }
          - { name: "Down",      key: j, command: "select-pane -D" }
          - { name: "Up",        key: k, command: "select-pane -U" }
          - { name: "Right",     key: l, command: "select-pane -R" }
          - { name: "Swap up",   key: U, command: "swap-pane -U" }
          - { name: "Swap down", key: D, command: "swap-pane -D" }
      - name: +Merge pane (vertical divider)
        key: m
        menu:
          - { name: "Into window 0", key: "0", command: "run-shell '~/.config/tmux/merge-pane.sh 0 h'" }
          - { name: "Into window 1", key: "1", command: "run-shell '~/.config/tmux/merge-pane.sh 1 h'" }
          - { name: "Into window 2", key: "2", command: "run-shell '~/.config/tmux/merge-pane.sh 2 h'" }
          - { name: "Into window 3", key: "3", command: "run-shell '~/.config/tmux/merge-pane.sh 3 h'" }
          - { name: "Into window 4", key: "4", command: "run-shell '~/.config/tmux/merge-pane.sh 4 h'" }
          - { name: "Into window 5", key: "5", command: "run-shell '~/.config/tmux/merge-pane.sh 5 h'" }
          - { name: "Into window 6", key: "6", command: "run-shell '~/.config/tmux/merge-pane.sh 6 h'" }
          - { name: "Into window 7", key: "7", command: "run-shell '~/.config/tmux/merge-pane.sh 7 h'" }
          - { name: "Into window 8", key: "8", command: "run-shell '~/.config/tmux/merge-pane.sh 8 h'" }
          - { name: "Into window 9", key: "9", command: "run-shell '~/.config/tmux/merge-pane.sh 9 h'" }
      - name: +Merge pane (horizontal divider)
        key: M
        menu:
          - { name: "Into window 0", key: "0", command: "run-shell '~/.config/tmux/merge-pane.sh 0 v'" }
          - { name: "Into window 1", key: "1", command: "run-shell '~/.config/tmux/merge-pane.sh 1 v'" }
          - { name: "Into window 2", key: "2", command: "run-shell '~/.config/tmux/merge-pane.sh 2 v'" }
          - { name: "Into window 3", key: "3", command: "run-shell '~/.config/tmux/merge-pane.sh 3 v'" }
          - { name: "Into window 4", key: "4", command: "run-shell '~/.config/tmux/merge-pane.sh 4 v'" }
          - { name: "Into window 5", key: "5", command: "run-shell '~/.config/tmux/merge-pane.sh 5 v'" }
          - { name: "Into window 6", key: "6", command: "run-shell '~/.config/tmux/merge-pane.sh 6 v'" }
          - { name: "Into window 7", key: "7", command: "run-shell '~/.config/tmux/merge-pane.sh 7 v'" }
          - { name: "Into window 8", key: "8", command: "run-shell '~/.config/tmux/merge-pane.sh 8 v'" }
          - { name: "Into window 9", key: "9", command: "run-shell '~/.config/tmux/merge-pane.sh 9 v'" }
      - name: +Status bar
        key: o
        menu:
          - { name: "Show", key: o, command: "set-option -g status on" }
          - { name: "Hide", key: c, command: "set-option -g status off" }
  - name: +Keys
    key: "?"
    command: list-keys -N
